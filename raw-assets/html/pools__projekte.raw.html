<style>
    /* ==== PROJECT GRID — contained cards, uniform size ==== */
    .pgrid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(1rem, 1.8vw, 1.6rem);
        max-width: 1500px;
        margin: 0 auto;
        padding: calc(var(--header-h) + clamp(1rem, 3vh, 2rem)) clamp(1.5rem, 4vw, 3rem) clamp(4rem, 7vw, 6rem);
    }
    .pcard { display: block; text-decoration: none; color: var(--text); }

    .pcard__media {
        position: relative;
        overflow: hidden;
        aspect-ratio: 3 / 2;
        background: var(--navy);
        border-radius: 6px;
    }

    /* Base scale/origin driven by per-card CSS variables so hover can MULTIPLY
       the base zoom instead of being overridden by inline transform. */
    .pcard__media img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        transform: scale(var(--card-zoom, 1));
        transform-origin: var(--card-origin, center);
        transition: filter 0.5s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pcard:hover .pcard__media img {
        filter: brightness(1.05);
        transform: scale(calc(var(--card-zoom, 1) * 1.03));
    }

    .pcard__media::after {
        content: '';
        position: absolute; inset: 0;
        pointer-events: none;
        opacity: 0.8;
        background: linear-gradient(to top, rgba(15,28,46,0.9) 0%, rgba(15,28,46,0.45) 16%, rgba(15,28,46,0.12) 34%, rgba(15,28,46,0) 56%);
        transition: opacity 0.5s ease;
    }
    .pcard:hover .pcard__media::after { opacity: 1; }

    .pcard__name {
        position: absolute;
        left: 0; bottom: 0;
        z-index: 2;
        padding: clamp(1rem, 2vw, 1.6rem);
        color: var(--white);
        font-size: clamp(1.05rem, 1.5vw, 1.35rem);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.01em;
        text-shadow: 0 1px 14px rgba(0,0,0,0.35);
    }

    @media (max-width: 600px)  {
        .pgrid { grid-template-columns: 1fr; }
    }
</style>
</head>
