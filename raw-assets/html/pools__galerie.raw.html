<style>
    body { background: var(--warm-white); }
    .g-hero {
        padding: calc(var(--header-h) + clamp(2.5rem, 6vh, 4.5rem)) clamp(1.5rem, 4vw, 3rem) clamp(2.5rem, 5vh, 4rem);
        text-align: center;
        color: var(--text);
    }
    .g-hero__eyebrow {
        font-size: 0.72rem; font-weight: 600;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--blue);
        margin: 0 0 1rem;
    }
    .g-hero__title {
        font-size: clamp(2rem, 4vw, 3.2rem);
        font-weight: 700; line-height: 1.08;
        letter-spacing: -0.02em;
        margin: 0 auto;
        max-width: 900px;
        color: var(--text);
    }
    .g-hero__sub {
        margin: 1rem auto 0;
        font-size: clamp(1rem, 1.35vw, 1.15rem);
        color: var(--slate);
        line-height: 1.55;
        max-width: 720px;
    }

    /* Masonry gallery — column layout preserves the mixed aspect ratios */
    .gallery { padding: 0 0 clamp(4rem, 8vh, 6rem); }
    .gallery__wrapper {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 clamp(0.5rem, 2vw, 1.5rem);
    }
    .gallery__grid {
        column-count: 3;
        column-gap: 6px;
    }
    .gallery__item {
        break-inside: avoid;
        margin-bottom: 6px;
        overflow: hidden;
        background: #eee;
    }
    .gallery__item img {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.6s cubic-bezier(0.25, 0, 0.25, 1);
    }
    .gallery__item:hover img { transform: scale(1.03); }

    @media (max-width: 1100px) {
        .gallery__grid { column-count: 2; }
    }
    @media (max-width: 600px) {
        .gallery__grid { column-count: 2; column-gap: 4px; }
        .gallery__item { margin-bottom: 4px; }
    }

    /* Bottom form band — matches technik landings' warm-white FAQ area */
    .g-form-band {
        background: #fff;
        border-top: 1px solid var(--border);
        padding: clamp(3.5rem, 7vh, 5.5rem) 0 clamp(4rem, 8vh, 6rem);
    }
    .g-form-band__inner {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 clamp(1.5rem, 4vw, 3rem);
    }
    .g-form-band__eyebrow {
        font-size: 0.72rem; font-weight: 700;
        letter-spacing: 0.14em; text-transform: uppercase;
        color: var(--blue);
        margin: 0 0 0.75rem;
        text-align: center;
    }
    .g-form-band__title {
        font-size: clamp(1.5rem, 2.5vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text);
        text-align: center;
        margin: 0 0 2rem;
    }
    .g-form-band .contact { padding: 0; max-width: none; }
</style>
</head>
